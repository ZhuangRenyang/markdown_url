services:
  - type: web
    name: markdowndown
    runtime: docker
    plan: free
    # 免费可选区域：oregon(美西) / frankfurt(欧洲) / singapore(新加坡)
    region: singapore
    branch: main
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # AI 接口（可选，用于「用 AI 处理 Markdown」）
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_MODEL_BIG
        sync: false
      # 可选：自己的站点地址，用于生成分享卡片
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
